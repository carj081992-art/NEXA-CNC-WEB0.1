    return s;
  }
  return {lessons, codes, rpm, mmMin, defaultState, normalizeState};

      return `<div class="lcd-label">SETTING</div><p class="lcd-plain">Настройки оператора и параметры отображения могут отличаться у конкретного EMCO.</p>`;

    if(s.page==='prog'){

      if(s.tab==='MDI')return `<div class="lcd-label">MDI · УЧЕБНАЯ ОБЛАСТЬ</div><div class="lcd-program">${htmlEscape(s.entry||'Вводи символы кнопками справа…')}</div><p class="lcd-footnote">Никаких команд не исполняется.</p>`;

    if(s.page==='message')return `<div class="lcd-label">${s.tab==='ALARM'?'ALARM MESSAGE':'ALARM HISTORY'}</div><div class="lcd-idle">NO ACTIVE DEMO ALARMS</div><p class="lcd-footnote">Это не проверка действительных аварий станка.</p>`;
    return `<div class="lcd-label">GRAPH · ${s.tab}</div><svg viewBox="0 0 300 140" width="100%" height="142" role="img" aria-label="Условная схема координат X и Z"><path d="M45 13V115H280" stroke="#39707c" stroke-width="2" fill="none"/><path d="M45 13l-5 9m5-9l5 9M280 115l-9-5m9 5l-9 5" stroke="#39707c" stroke-width="2"/><text x="24" y="17" fill="#245064">X</text><text x="286" y="134" fill="#245064">Z</text><path d="M65 95H120V75H180V50H247" stroke="#1c7091" stroke-dasharray="7 5" stroke-width="3" fill="none"/></svg><p class="lcd-footnote">Условная иллюстрация. Не симулятор траектории обработки.</p>`;
  }
  const functionButtons=[['pos','POS'],['prog','PROG'],['offset','OFS/SET'],['system','SYSTEM'],['message','MESSAGE'],['graph','GRAPH']];
  const dataButtons=['7','8','9','X','4','5','6','Z','1','2','3','G','-','0','.','+','CAN','INPUT','RESET','HELP'];
  function infoText(){
    if(s.help)return `<div class="sim-meaning"><strong>Справка по ${htmlEscape(s.page.toUpperCase())} / ${htmlEscape(s.tab)}</strong><p>${htmlEscape(explain())}</p></div>`;
    if(s.info)return `<div class="sim-meaning"><strong>Пояснение</strong><p>${htmlEscape(s.info)}</p></div>`;
    return `<div class="sim-meaning"><strong>Нажимай кнопки</strong><p>Выбери раздел слева/под экраном, затем экранную клавишу. Все значения — учебные, без связи с ЧПУ.</p></div>`;
  }
  function explain(){
    if(s.page==='pos')return 'POS открывает экран координат. ABS и REL различаются системой отсчёта; ALL даёт обзор. Числа здесь всегда демонстрационные.';
    if(s.page==='prog')return 'PROG предназначен для просмотра программ и связанных функций. В этой версии просмотр без редактирования реального кода.';
    if(s.page==='offset')return ({GEOM:'GEOMETRY хранит базовые коррекции инструмента X/Z. Нельзя приравнивать к G54.',WEAR:'WEAR — отдельные поправки на износ инструмента, не заменяют геометрию.',WORK:'WORK — рабочие смещения G54–G59; не являются номерами резцов.',SET:'SETTING — настройки оператора. Их расположение зависит от комплектации.'})[s.tab];
    if(s.page==='system')return 'SYSTEM используется для просмотра системных разделов, параметров и диагностики. В учебном приложении только описание.';

    return 'GRAPH — графическая функция, её наличие и возможности зависят от оснащения станка. Показана условная иллюстрация.';
  }
  function missionUI(){
    const chosen=missions[s.mission];
    return `<section class="sim-mission" aria-label="Учебные задания"><div class="sim-mission-top"><strong>🎯 Практика на пульте</strong><span>${s.completed.length} / ${missions.length} пройдено</span></div><div class="sim-mission-list">${missions.map((m,i)=>`<button data-sim-mission="${i}" class="sim-task-btn ${s.mission===i?'active':''}" aria-pressed="${s.mission===i}">${s.completed.includes(i)?'✓':'○'} ${i+1}</button>`).join('')}</div><strong>${chosen?htmlEscape(chosen.label):'Выбери учебное задание'}</strong><p>${chosen?htmlEscape(chosen.description):'Попробуй найти нужный экран без подсказок по расположению кнопок.'}</p>${chosen?`<button class="button secondary" data-sim-check="1">Проверить действие</button> <button class="button ghost" data-sim-hint="1">Подсказка</button>`:''}${taskMessage?`<div class="sim-feedback" role="status">${htmlEscape(taskMessage)}</div>`:''}</section>`;
  }
  function render(){
    return `<button class="back" data-go="home">← Главная</button><p class="eyebrow">NEXA CNC 0.2 / ВИРТУАЛЬНАЯ ЛАБОРАТОРИЯ</p><h1 class="page-title">Пульт <span>FANUC 0i‑TD</span></h1><p class="subtitle">Интерактивная учебная модель интерфейса FANUC Series 0i-D. Не точная цифровая копия панели EMCO.</p>
    <div class="sim-alert"><span>● DEMO · OFFLINE</span><span>НЕТ СВЯЗИ СО СТАНКОМ</span></div>
    <section class="sim-case" aria-label="Виртуальная панель">
      <div class="sim-display-frame"><div class="sim-display"><div class="sim-lcd-top"><span>FANUC SERIES 0i‑TD · TRAINING</span><span>O0000 N0000</span></div><div class="sim-lcd-title">${nav[s.page].title} <span>${s.tab}</span></div><div class="sim-lcd-content">${screenView()}</div><div class="sim-lcd-entry">&gt; ${htmlEscape(s.entry)}<span class="cursor-sim">▮</span></div><div class="sim-lcd-bottom"><span>SIM</span><span>EDIT</span><span>NO MACHINE LINK</span></div></div>
      <div class="sim-softkeys">${softButtons()}</div><div class="sim-softkey-help">ЭКРАННЫЕ КЛАВИШИ · демонстрационный набор</div></div>
      <div class="sim-hardware"><div class="sim-key-title">ФУНКЦИОНАЛЬНЫЕ КЛАВИШИ</div><div class="sim-fkeys">${functionButtons.map(([id,label])=>`<button class="sim-fkey ${s.page===id?'active':''}" data-sim-page="${id}" aria-pressed="${s.page===id}">${label}</button>`).join('')}</div>
      <div class="sim-key-title">УЧЕБНАЯ КЛАВИАТУРА</div><div class="sim-data-keys">${dataButtons.map(k=>`<button data-sim-key="${k}" class="sim-key ${['INPUT','RESET','HELP'].includes(k)?'special':''}">${k}</button>`).join('')}</div>
      <div class="sim-key-title">НАВИГАЦИЯ ПО СТРОКАМ</div><div class="sim-arrows"><button data-sim-nav="pageup">PAGE ↑</button><button data-sim-nav="up">↑</button><button data-sim-nav="down">↓</button><button data-sim-nav="pagedown">PAGE ↓</button></div></div>
    </section>${infoText()}${missionUI()}<div class="notice"><strong>⚠️ Только учебная имитация.</strong> Клавиши не связаны с реальным ЧПУ и не могут менять коррекции, параметры, программу, перемещать оси или запускать шпиндель. Состав экранов, soft keys и расположение кнопок у твоего EMCO могут отличаться — сверяй с руководством и наставником.</div>`;
  }
  function mainRender(){const app=document.getElementById('app');if(app && location.hash.startsWith('#simulator'))app.innerHTML=render();}
  function paint(){mainRender();}
  function setPage(page){if(!nav[page])return;missionTouched=true;s.page=page;s.tab=defaults[page];s.row=0;s.help=false;s.info=explain();taskMessage='';paint();}
  function setTab(tab){if(!nav[s.page].tabs.some(x=>x[0]===tab))return;missionTouched=true;s.tab=tab;s.row=0;s.help=false;s.info=explain();taskMessage='';paint();}
  document.addEventListener('click',ev=>{
    if(!location.hash.startsWith('#simulator'))return;
    const el=ev.target.closest('[data-sim-page],[data-sim-tab],[data-sim-key],[data-sim-nav],[data-sim-mission],[data-sim-check],[data-sim-hint]');
    if(!el)return;
    if(el.dataset.simPage){setPage(el.dataset.simPage);return;}
    if(el.dataset.simTab){setTab(el.dataset.simTab);return;}
    if(el.dataset.simNav){const num=s.page==='offset'&&s.tab==='WORK'?6:12;const dir=({up:-1,down:1,pageup:-4,pagedown:4})[el.dataset.simNav];s.row=Math.min(num-1,Math.max(0,s.row+dir));s.info='Выбранная строка: '+(s.tab==='WORK'?'G'+(54+s.row):'инструмент '+String(s.row+1).padStart(2,'0'))+'. Значения не изменены.';paint();return;}
    if(el.dataset.simKey){const k=el.dataset.simKey;if(k==='CAN')s.entry=s.entry.slice(0,-1);else if(k==='RESET'){s.entry='';s.info='Учебный ввод очищен (настоящее ЧПУ не задействовано).';}else if(k==='HELP'){s.help=!s.help;s.info='';}else if(k==='INPUT'){s.info='Ввод не записывается. Это только симулятор; никаких коррекций и программ не изменено.';}else if(s.entry.length<42)s.entry+=k;paint();return;}
    if(el.dataset.simMission){s.mission=Number(el.dataset.simMission);missionTouched=false;taskMessage='';paint();return;}
    if(el.dataset.simHint){taskMessage='Подсказка: '+missions[s.mission].description;paint();return;}
    if(el.dataset.simCheck){const m=missions[s.mission];if(m&&missionTouched&&m.test(s)){if(!s.completed.includes(s.mission))s.completed.push(s.mission);save();taskMessage='✅ Верно! '+m.why;}else taskMessage='Пока не совпало. Смотри цель задания и попробуй ещё раз.';paint();}
  });
  window.CncSimulator={render,mainRender,missions,nav};
})();

  <script>
/* NEXA CNC — учебный тренажёр G54 / X / Z. Не обращается к станку или сети. */
(() => {
  'use strict';
  const STORAGE = 'nexa-cnc-trainer-v1';
  const SCENARIOS = {
    a: {label:'Сценарий A', machine:-246.250, target:40.000, measured:40.600, face:0.350},
    b: {label:'Сценарий B', machine:-185.750, target:32.000, measured:31.400, face:-0.250}
  };
  const GROUPS = {
    g54:{name:'G54',sub:'Ноль детали',icon:'◎',description:'Отличай рабочую систему координат от геометрии инструмента. В задачах ниже действует только упрощённая математическая модель.'},
    x:{name:'Ось X',sub:'Диаметр резца',icon:'⌀',description:'Разбираем диаметр, радиус и GEOMETRY X. Здесь вычисляется ошибка размера, а не команда коррекции станка.'},
    z:{name:'Ось Z',sub:'Торец и длина',icon:'↔',description:'Показываем роль торца Z0, геометрии Z и отклонения длины в учебном примере.'}
  };
  const tasks = [
    {id:'g54-menu',group:'g54',type:'choice',title:'Найди экран G54',prompt:()=> 'Где искать рабочее смещение G54 в учебной модели FANUC?',options:['OFFSET / SETTING → GEOMETRY','OFFSET / SETTING → WORK','OFFSET / SETTING → WEAR'],answer:1,hint:'G54 относится ко всей рабочей системе координат детали, а не к отдельному резцу.',why:'Верно: WORK содержит рабочие системы G54–G59. GEOMETRY и WEAR относятся к инструменту.'},
    {id:'g54-zero',group:'g54',type:'number',title:'Перенос начала координат',prompt:s=>`В абстрактной модели Zд = Zм − O, в точке желаемого Z0 значение Zм = ${fmt(s.machine)} мм. Какое O даст Zд = 0?`,formula:'Zд = Zм − O',answer:s=>s.machine,unit:'мм',hint:'Подставь Zд = 0. Тогда O = Zм. Учитывай отрицательный знак.',why:'Это только упражнение на перенос координат. Реальный рабочий сдвиг FANUC может учитывать внешний сдвиг, геометрию и настройки EMCO; не вводи это число в станок.'},
    {id:'g54-meaning',group:'g54',type:'choice',title:'Что задаёт G54?',prompt:()=> 'Что описывает G54 в типичной токарной системе FANUC?',options:['Систему координат заготовки','Длину одного конкретного резца','Поправку на износ пластины'],answer:0,hint:'Подумай, что остаётся связано с деталью, даже когда меняешь резец.',why:'G54 выбирает рабочую систему координат. Привязка инструмента хранится отдельно.'},
    {id:'x-screen',group:'x',type:'choice',title:'Базовая геометрия X',prompt:()=> 'В какой таблице в учебной модели хранится базовая геометрическая коррекция резца по X?',options:['WORK / G54','GEOMETRY / X','WEAR / Z'],answer:1,hint:'Ищи слово GEOMETRY и ось X.',why:'GEOMETRY X — базовая привязка инструмента. Номер позиции револьвера и номер коррекции необходимо проверять отдельно.'},
    {id:'x-diameter',group:'x',type:'number',title:'Ошибка диаметра',prompt:s=>`На чертеже ⌀${fmt(s.target)} мм, после учебного прохода измерен ⌀${fmt(s.measured)} мм. Вычисли измеренный минус заданный диаметр (со знаком).`,formula:'ΔD = Dизм − Dзад',answer:s=>s.measured-s.target,unit:'мм',hint:'Из большего/меньшего измеренного диаметра вычти размер по чертежу. Результат может быть отрицательным.',why:'Это разница диаметров, НЕ готовое значение для WEAR X. Знак и величину реальной коррекции нельзя назначать без проверки режима X, ориентации резца и станка.'},
    {id:'x-radius',group:'x',type:'number',title:'Диаметр ≠ радиус',prompt:s=>`Разница диаметров по модулю равна ${fmt(Math.abs(s.measured-s.target))} мм. Какова соответствующая разница радиусов по модулю?`,formula:'|ΔR| = |ΔD| ÷ 2',answer:s=>Math.abs(s.measured-s.target)/2,unit:'мм',hint:'Радиус — половина диаметра.',why:'При диаметральном задании X разница диаметра и радиального перемещения не одно и то же. Это не инструкция по знаку/величине износа на реальном ЧПУ.'},
    {id:'z-face',group:'z',type:'choice',title:'Выбери торец Z0',prompt:()=> 'В нашем учебном примере Z0 принят на обработанном переднем торце детали. Где находится ноль по Z?',options:['На оси вращения шпинделя','На выбранной передней плоскости торца','В центре револьверной головки'],answer:1,hint:'Z здесь измеряет положение вдоль длины детали.',why:'В этой задаче передняя плоскость — Z0. На реальном станке выбор базы зависит от чертежа и наладки.'},
    {id:'z-deviation',group:'z',type:'number',title:'Отклонение вдоль Z',prompt:s=>`В учебном контроле торца измерено смещение относительно заданной плоскости Z0: ${fmt(s.face)} мм. Каково абсолютное значение отклонения?`,formula:'|ΔZ| = модуль смещения',answer:s=>Math.abs(s.face),unit:'мм',hint:'Отрицательное число при взятии модуля становится положительным.',why:'Абсолютное отклонение показывает величину несовпадения. Оно само по себе не даёт безопасного значения коррекции на станке.'},
    {id:'z-screen',group:'z',type:'choice',title:'Геометрия Z или G54?',prompt:()=> 'Нужно найти базовую геометрию по Z именно выбранного резца. Какой учебный экран открыть?',options:['GEOMETRY → Z','WORK → G54 X','MESSAGE → ALARM'],answer:0,hint:'Отдельный инструмент — отдельная геометрия.',why:'GEOMETRY Z относится к выбранной коррекции инструмента. G54 задаёт рабочую систему детали и не заменяет привязку каждого резца.'}
  ];
  let view = {group:'g54',index:0,scenario:'a',results:{},feedback:null,showHint:false};
  try {
    const stored=JSON.parse(localStorage.getItem(STORAGE)||'null');
    if(stored && typeof stored==='object'){
      if(Object.hasOwn(GROUPS,stored.group))view.group=stored.group;
      if(Object.hasOwn(SCENARIOS,stored.scenario))view.scenario=stored.scenario;
      if(stored.results && typeof stored.results==='object') for(const [k,v] of Object.entries(stored.results)) if(v===true && /^[ab]:(g54|x|z)-[a-z]+$/.test(k))view.results[k]=true;
    }
  } catch (_) { /* Блокировка localStorage не мешает обучению */ }
  const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const fmt=n=>Number(n).toFixed(3);
  const taskList=()=>tasks.filter(t=>t.group===view.group);
  const activeTask=()=>taskList()[view.index]||taskList()[0];
  const key=t=>view.scenario+':'+t.id;
  const complete=t=>!!view.results[key(t)];
  const count=()=>tasks.filter(complete).length;
  const save=()=>{try{localStorage.setItem(STORAGE,JSON.stringify({group:view.group,scenario:view.scenario,results:view.results}));}catch(_) {}};
  const parseNumber=value=>{
    const raw=String(value??'').trim().replace(',','.');
    if(!/^[+-]?(?:\d+(?:\.\d*)?|\.\d+)$/.test(raw))return null;
    const result=Number(raw);
    return Number.isFinite(result)&&Math.abs(result)<1000000?result:null;
  };
  function evaluate(t,value){
    if(t.type==='choice')return Number(value)===t.answer;
    const n=parseNumber(value),expected=typeof t.answer==='function'?t.answer(SCENARIOS[view.scenario]):t.answer;
    return n!==null&&Math.abs(n-expected)<=0.00101;
  }
  function diagram(){

        <rect x="20" y="30" width="90" height="160" rx="7" fill="#384151" stroke="#71849e"/><rect x="48" y="30" width="11" height="160" fill="#626d82"/><rect x="85" y="50" width="44" height="120" rx="4" fill="url(#hatch)" stroke="#7d8da4"/>
        <rect x="126" y="69" width="280" height="82" rx="3" fill="url(#metal)" stroke="#bec8d7"/><rect x="126" y="82" width="280" height="7" fill="#c4d0df" opacity=".35"/>
        <line x1="12" y1="110" x2="532" y2="110" stroke="#89a1b8" opacity=".6" stroke-width="1" stroke-dasharray="7 7"/><line x1="406" y1="18" x2="406" y2="190" stroke="${t==='g54'||t==='z'?highlight:'#60768d'}" stroke-width="${t==='g54'||t==='z'?3:1.5}" stroke-dasharray="5 5"/>
        <circle cx="406" cy="110" r="5" fill="${highlight}"/><line x1="406" y1="110" x2="535" y2="110" stroke="${highlight}" stroke-width="2"/><path d="M535 110l-9 -6v12z" fill="${highlight}"/><line x1="406" y1="110" x2="406" y2="19" stroke="${highlight}" stroke-width="2"/><path d="M406 19l-6 10h12z" fill="${highlight}"/>

        ${t==='x'?'<line x1="325" y1="69" x2="325" y2="151" stroke="'+highlight+'" stroke-width="3"/><path d="M325 69l-6 9h12zM325 151l-6 -9h12z" fill="'+highlight+'"/><text x="337" y="106" fill="'+highlight+'" font-size="15" font-weight="bold">⌀D</text>':''}
        ${t==='z'?'<path d="M445 63l-12 7v-14z" fill="'+highlight+'"/><line x1="445" y1="63" x2="517" y2="63" stroke="'+highlight+'" stroke-dasharray="4 4"/><text x="449" y="53" fill="'+highlight+'" font-size="12">Торец Z0</text>':''}
      </svg><div class="ot-legend"><span><i style="background:${highlight}"></i>${t==='g54'?'Система координат детали':t==='x'?'Ось X / диаметр':'Ось Z / торец'}</span><span>СХЕМА · НЕ В МАСШТАБЕ</span></div></div>`;
  }
  function taskView(){
    const t=activeTask(),s=SCENARIOS[view.scenario],done=complete(t),feedback=view.feedback;
    const contents=t.type==='choice'?
      `<div class="ot-options" role="group" aria-label="Варианты ответа">${t.options.map((name,i)=>`<label class="ot-option"><input type="radio" name="ot-answer" value="${i}" ${view.feedback?.value===String(i)?'checked':''}><span class="ot-option-marker">${String.fromCharCode(65+i)}</span><span>${esc(name)}</span></label>`).join('')}</div>`:
      `<div class="ot-equation">${esc(t.formula)}</div><label for="ot-number" class="ot-fieldlabel">Твой ответ, ${esc(t.unit)}</label><div class="ot-numberbox"><input id="ot-number" name="ot-answer" inputmode="decimal" type="text" autocomplete="off" maxlength="25" spellcheck="false" placeholder="Например: −0,350" value="${esc(view.feedback?.value||'')}" aria-describedby="ot-inputtip"><span>${esc(t.unit)}</span></div><small id="ot-inputtip" class="ot-helper">Можно вводить с точкой или запятой, если требуется — со знаком минус.</small>`;
    return `<div class="ot-taskhead"><span class="ot-stepbadge">ЗАДАНИЕ ${view.index+1} / ${taskList().length}</span><span class="${done?'ot-complete':'ot-pending'}">${done?'✓ Решено':'○ Практика'}</span></div><h2 class="ot-tasktitle">${esc(t.title)}</h2><p class="ot-prompt">${esc(t.prompt(s))}</p><form id="ot-answer-form">${contents}<div class="ot-taskactions"><button type="submit" class="button">Проверить ответ <span aria-hidden="true">↗</span></button><button type="button" class="button secondary" data-ot-hint="1">${view.showHint?'Скрыть подсказку':'Подсказка'}</button></div></form>
      ${view.showHint?`<div class="ot-hint">💡 ${esc(t.hint)}</div>`:''}${feedback?`<div class="ot-feedback ${feedback.good?'good':'bad'}" role="status"><b>${feedback.good?'✓ Отлично, правильно!':'↻ Пока не совпало'}</b><p>${feedback.good?esc(t.why):esc(feedback.message||'Попробуй ещё раз, а если сложно — открой подсказку.')}</p></div>`:''}<div class="ot-taskfoot"><button class="button ghost" data-ot-prev="1" ${view.index===0?'disabled':''}>← Назад</button><button class="button secondary" data-ot-next="1" ${view.index===taskList().length-1?'disabled':''}>Следующий шаг →</button></div>`;
  }
  function render(){
    const chosen=GROUPS[view.group],n=count(),all=tasks.length;
    return `<button class="back" data-go="home">← Главная</button>
      <div class="ot-headline"><div><p class="eyebrow">NEXA CNC 0.2 / УЧЕБНАЯ ЛАБОРАТОРИЯ</p><h1 class="page-title">Привязка <span>X / Z / G54</span></h1><p class="subtitle">Интерактивные задания на понимание координат, диаметров и коррекций. Для FANUC 0i‑TD на твоём EMCOturn.</p></div><span class="ot-live">● SIMULATION ONLY</span></div>
      <div class="ot-warning"><b>⚠️ Это учебная модель, не процедура наладки.</b><span>Показанные цифры вымышлены и НЕ являются значениями для ввода в станок. Реальная настройка зависит от оснастки, геометрии, G50, внешних сдвигов и параметров EMCO/FANUC. Работай по инструкции предприятия с наставником.</span></div>
      <div class="ot-stat"><div><span class="ot-statlabel">ТВОЙ ПРОГРЕСС</span><b>${n} <small>/ ${all}</small></b></div><div class="ot-progress"><div style="width:${Math.round(n*100/all)}%"></div></div><span class="ot-percent">${Math.round(n*100/all)}%</span></div>
      <div class="ot-toolbar"><span>Учебный набор</span><select id="ot-scenario" aria-label="Выбрать сценарий"><option value="a" ${view.scenario==='a'?'selected':''}>Сценарий A</option><option value="b" ${view.scenario==='b'?'selected':''}>Сценарий B</option></select></div>
      <div class="ot-tabs" role="group" aria-label="Выбери раздел тренажёра">${Object.entries(GROUPS).map(([id,g])=>`<button class="ot-tab ${view.group===id?'active':''}" data-ot-group="${id}" aria-pressed="${view.group===id}"><span class="ot-tab-ico">${g.icon}</span><strong>${g.name}</strong><small>${tasks.filter(t=>t.group===id&&complete(t)).length}/3</small></button>`).join('')}</div>
      <section class="ot-section"><div class="ot-sectiontop"><span class="ot-chapter">МОДУЛЬ ${view.group==='g54'?'01':view.group==='x'?'02':'03'} / ${esc(chosen.sub.toUpperCase())}</span><h2>${esc(chosen.name)} <span>· ${esc(chosen.sub)}</span></h2><p>${esc(chosen.description)}</p></div>
      ${diagram()}<div class="ot-pillrow">${taskList().map((t,i)=>`<button class="ot-pill ${i===view.index?'active':''} ${complete(t)?'done':''}" data-ot-index="${i}" aria-label="Задание ${i+1}${complete(t)?', выполнено':''}" aria-pressed="${i===view.index}">${complete(t)?'✓':i+1}</button>`).join('')}</div><div class="ot-task">${taskView()}</div></section>
      ${n===all?'<div class="ot-winner">🏆 Все задания сценария выполнены! Попробуй другой сценарий или открой виртуальный пульт.</div>':''}
      <div class="ot-footer"><button class="button secondary" data-go="simulator">🎛️ Перейти к пульту FANUC</button><button class="button ghost" data-ot-reset="1">↺ Сбросить прогресс сценария</button></div>
      <p class="ot-source">Учебная теория: FANUC Series 0i-D Operator’s Manual (B-64304EN/03). Экраны и математические модели упрощены; приложение не подключено к оборудованию.</p>`;
  }
  function rerender(){ if(location.hash.startsWith('#trainer')){const target=document.getElementById('app');if(target)target.innerHTML=render();} }
  function navigate(part,index=0){view.group=part;view.index=index;view.feedback=null;view.showHint=false;save();rerender();}
  document.addEventListener('click',ev=>{
    if(!location.hash.startsWith('#trainer'))return;
    const el=ev.target.closest('[data-ot-group],[data-ot-index],[data-ot-prev],[data-ot-next],[data-ot-hint],[data-ot-reset]');
    if(!el)return;
    if(el.hasAttribute('data-ot-group')){if(Object.hasOwn(GROUPS,el.dataset.otGroup))navigate(el.dataset.otGroup);return;}
    if(el.hasAttribute('data-ot-index')){const i=Number(el.dataset.otIndex);if(Number.isInteger(i)&&i>=0&&i<taskList().length)navigate(view.group,i);return;}
    if(el.hasAttribute('data-ot-prev')){navigate(view.group,Math.max(view.index-1,0));return;}
    if(el.hasAttribute('data-ot-next')){const i=Math.min(view.index+1,taskList().length-1);navigate(view.group,i);return;}
    if(el.hasAttribute('data-ot-hint')){view.showHint=!view.showHint;rerender();return;}
    if(el.hasAttribute('data-ot-reset')&&confirm('Удалить результаты текущего сценария? Остальные данные NEXA CNC не затронутся.')){
      for(const key of Object.keys(view.results))if(key.startsWith(view.scenario+':'))delete view.results[key];view.feedback=null;save();rerender();return;
    }
  });
  document.addEventListener('change',ev=>{
    if(location.hash.startsWith('#trainer')&&ev.target.id==='ot-scenario'&&Object.hasOwn(SCENARIOS,ev.target.value)){
      view.scenario=ev.target.value;view.index=0;view.feedback=null;view.showHint=false;save();rerender();
    }
  });
  document.addEventListener('submit',ev=>{
    if(ev.target.id!=='ot-answer-form'||!location.hash.startsWith('#trainer'))return;
    ev.preventDefault();
    const t=activeTask();let input;
    if(t.type==='number')input=ev.target.querySelector('#ot-number')?.value;
    else input=ev.target.querySelector('input[name="ot-answer"]:checked')?.value;
    if(input===undefined||input===null||input===''){
      view.feedback={good:false,message:'Сначала выбери вариант или введи число.'};rerender();return;
    }
    const good=evaluate(t,input);
    if(good){view.results[key(t)]=true;save();}
    view.feedback={good,value:String(input),message:good?'':t.type==='number'&&parseNumber(input)===null?'Проверь формат числа: используй цифры, точку или запятую и знак минус при необходимости.':'Проверь определение и расчёт. Числа в примере учебные.'};
    rerender();
  });
  window.CncOffsetTrainer={render,tasks,SCENARIOS,parseNumber,evaluate,getProgress:()=>count()};
})();

</script>
  <script>
/* NEXA CNC 0.2 WEB — offline app. No network requests or machine control. */
(() => {
  'use strict';
  const D = window.CncData;
  let state = D.defaultState();
  let route = 'home', activeLesson = 'g54', toolPosition = 1;
  let photoDraft = '', saveChain = Promise.resolve(), db = null, storageMode = 'indexeddb';
  const app = document.getElementById('app');
  const safe = value => String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const pct = (done,total) => total ? Math.round(100*done/total) : 0;
  const completed = l => (state.lessonChecks[l.id] || []).filter(Boolean).length;
  const showToast = msg => { const el=document.getElementById('toast'); el.textContent=msg;el.style.display='block';clearTimeout(showToast.t);showToast.t=setTimeout(()=>el.style.display='none',3500); };
  async function loadStore() {
    try {
      db = await new Promise((resolve,reject) => {
        const req = indexedDB.open('nexa-cnc-data-v1',1);
        req.onupgradeneeded=()=>req.result.createObjectStore('store');
        req.onsuccess=()=>resolve(req.result);
        req.onerror=()=>reject(req.error);
      });
      const saved = await new Promise((resolve,reject) => {
        const req=db.transaction('store').objectStore('store').get('state');
        req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error);
      });
      if (saved) state=D.normalizeState(saved);
    } catch (e) {
      storageMode='localStorage';
      try {const s=localStorage.getItem('nexa-cnc-v1'); if(s)state=D.normalizeState(JSON.parse(s));}
      catch {showToast('Память недоступна: данные могут не сохраниться');}
    }
  }
  function persist() {
    state.lastUpdated=new Date().toISOString();
    const snapshot=JSON.parse(JSON.stringify(state));
    saveChain=saveChain.catch(()=>{}).then(async()=>{
      if (storageMode==='indexeddb') {
        await new Promise((resolve,reject)=>{
          const tx=db.transaction('store','readwrite');
          tx.objectStore('store').put(snapshot,'state');
          tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error);tx.onabort=()=>reject(tx.error);
        });
      } else localStorage.setItem('nexa-cnc-v1',JSON.stringify(snapshot));
    }).catch(err=>{showToast('⚠️ Не удалось сохранить данные! Сделай резервную копию.');throw err;});
    return saveChain;
  }
  function nav(next, detail) {
    if (next==='lesson') activeLesson=detail || activeLesson;
    route=next;
    const hash=next==='lesson'?'lesson/'+activeLesson:next;
    if (location.hash.slice(1)!==hash) history.pushState(null,'','#'+hash);
    render();window.scrollTo({top:0,behavior:'instant'});
  }
  function syncHash(){const raw=decodeURIComponent(location.hash.slice(1)); const [section, detail]=raw.split('/');
    if(['home','lessons','lesson','tools','codes','diary','settings','calc','preflight','simulator','trainer'].includes(section)) {route=section;if(section==='lesson'&&D.lessons.some(l=>l.id===detail))activeLesson=detail;}
    else route='home';render();
  }
  function header(eye,title,sub){return `<p class="eyebrow">${safe(eye)}</p><h1 class="page-title">${title}</h1>${sub?`<p class="subtitle">${sub}</p>`:''}`;}
  function alert(){return `<div class="notice"><strong>⚠️ Безопасность:</strong> это учебная шпаргалка, а не инструкция по пуску станка. Перед изменением коррекций и перемещениями сверяйся с документацией именно твоего EMCO и ответственным наладчиком.</div>`;}
  function percentBar(value){return `<div class="progress" role="progressbar" aria-valuenow="${value}" aria-valuemin="0" aria-valuemax="100"><div style="width:${value}%"></div></div>`;}
  function renderHome(){
    const done=D.lessons.reduce((n,l)=>n+completed(l),0), total=D.lessons.reduce((n,l)=>n+l.steps.length,0);
    return `<div class="hero"><span class="tag green">● ОБУЧЕНИЕ БЕЗ ИНТЕРНЕТА</span><h1>Твой ЧПУ.<br><span style="color:#c59bff">Твои правила роста.</span></h1><p>Практический помощник по FANUC 0i‑TD. Тренажёр G54 и резцов X/Z, виртуальный пульт, уроки и дневник наладки.</p><div class="inline-actions"><button class="button" data-go="trainer">🧪 Тренажёр X / Z / G54 →</button><button class="button secondary" data-go="simulator">🎛️ Пульт FANUC</button><button class="button secondary" data-go="lesson" data-detail="g54">🎯 Урок G54</button></div></div>
    <div class="section-head"><h2>Мой прогресс</h2><small>${done} из ${total} шагов</small></div><div class="statbar"><div><strong>${pct(done,total)}%</strong><div class="muted" style="font-size:12px">Учебные шаги</div></div><span class="tag">${safe(state.machine)}</span></div>${percentBar(pct(done,total))}
    <div class="section-head"><h2>Быстрый доступ</h2><small>Под рукой у станка</small></div><div class="grid2">
      <button class="action-card" data-go="trainer"><span class="card-ico">🧪</span><strong>Тренажёр X / Z / G54</strong><small>9 заданий, 2 сценария · NEW</small></button>
      <button class="action-card" data-go="simulator"><span class="card-ico">🎛️</span><strong>Виртуальный пульт</strong><small>Интерактивный FANUC 0i‑TD · NEW</small></button>
      <button class="action-card" data-go="lesson" data-detail="g54"><span class="card-ico">🎯</span><strong>Привязка G54</strong><small>Рабочий ноль детали</small></button>
      <button class="action-card" data-go="lesson" data-detail="x"><span class="card-ico">📏</span><strong>Коррекция X</strong><small>Геометрия по диаметру</small></button>
      <button class="action-card" data-go="lesson" data-detail="z"><span class="card-ico">↔️</span><strong>Коррекция Z</strong><small>Геометрия по торцу</small></button>
      <button class="action-card" data-go="preflight"><span class="card-ico">🛡️</span><strong>Я у станка</strong><small>Чек-лист подготовки</small></button>
      <button class="action-card" data-go="calc"><span class="card-ico">🧮</span><strong>Калькулятор</strong><small>Обороты и подача</small></button>
      <button class="action-card" data-go="settings"><span class="card-ico">⚙️</span><strong>Мои данные</strong><small>Настройки и резервная копия</small></button>
    </div>${alert()}`;
  }
  function renderLessons(){return header('01 / ОБУЧЕНИЕ','Уроки <span>FANUC</span>','Короткие объяснения и контрольные этапы. Отмеченные шаги сохраняются на устройстве.')+
    D.lessons.map(l=>`<button class="lesson-card" style="margin-bottom:10px" data-go="lesson" data-detail="${l.id}"><div class="lesson-card-row"><span class="card-ico">${l.icon}</span><div><strong>${safe(l.name)}</strong><small>${safe(l.short)}</small></div></div>${percentBar(pct(completed(l),l.steps.length))}<span class="tag">${completed(l)} / ${l.steps.length} · ${safe(l.tag)}</span></button>`).join('')+alert();}
  function renderLesson(){const l=D.lessons.find(x=>x.id===activeLesson)||D.lessons[0]; const checks=state.lessonChecks[l.id]||[];
    return `<button class="back" data-go="lessons">← Все уроки</button>`+header('УЧЕБНАЯ КАРТОЧКА',`${l.icon} ${safe(l.name)}`,safe(l.intro))+
      `<div class="statbar"><div><strong>${completed(l)}/${l.steps.length}</strong><div class="muted" style="font-size:12px">Пройденные пункты</div></div><span class="tag">${safe(l.tag)}</span></div>${percentBar(pct(completed(l),l.steps.length))}`+
      `<div class="section-head"><h2>Порядок изучения</h2></div>`+l.steps.map(([title,detail],i)=>`<div class="step ${checks[i]?'checked':''}"><input type="checkbox" id="lesson-${l.id}-${i}" data-lesson-check="${l.id}" data-index="${i}" ${checks[i]?'checked':''}><label for="lesson-${l.id}-${i}"><strong>${i+1}. ${safe(title)}</strong><p>${safe(detail)}</p></label></div>`).join('')+
      `<div class="panel"><strong>📓 Запиши свой опыт</strong><p class="muted" style="font-size:13px">Как именно этот шаг выполняется на твоём станке? Добавь заметку и фотографию панели.</p><button class="button secondary" data-go="diary">Открыть дневник →</button></div>${alert()}`;}
  function renderTools(){const t=state.tools[toolPosition-1];
    return header('02 / РЕВОЛЬВЕРНАЯ ГОЛОВКА','Мои <span>резцы</span>','12 позиций. Сохраняй установленную оснастку и свои измерения. Эти записи не передаются на станок.')+
      `<div class="tool-grid">${state.tools.map(x=>`<button class="tool-btn ${x.position===toolPosition?'active':''} ${x.name?'has-data':''}" data-tool="${x.position}"><span class="tool-no">T${String(x.position).padStart(2,'0')}</span><small>${safe(x.name||'Пусто')}</small></button>`).join('')}</div>`+
      `<div class="panel"><h2 style="margin-top:0;font-size:19px">Позиция T${String(toolPosition).padStart(2,'0')}</h2><form id="tool-form"><div class="field"><label for="tool-name">Название инструмента</label><input id="tool-name" maxlength="90" value="${safe(t.name)}" placeholder="Например: проходной наружный"></div><div class="field"><label for="tool-kind">Тип / пластина</label><input id="tool-kind" maxlength="90" value="${safe(t.kind)}" placeholder="Например: CNMG"></div><div class="grid2"><div class="field"><label for="tool-x">Запись X</label><input id="tool-x" maxlength="90" value="${safe(t.x)}" placeholder="Моё измерение"></div><div class="field"><label for="tool-z">Запись Z</label><input id="tool-z" maxlength="90" value="${safe(t.z)}" placeholder="Моё измерение"></div></div><div class="field"><label for="tool-note">Примечание</label><textarea id="tool-note" maxlength="600" placeholder="Вылет, радиус, особенности…">${safe(t.note)}</textarea></div><button type="submit" class="button full">💾 Сохранить позицию</button></form></div><p class="preview-note">Важно: номер позиции T и номер коррекции могут не совпадать. Поля X/Z здесь — личные заметки, не активные параметры станка.</p>${alert()}`;
  }
  function codeCards(query=''){const q=query.trim().toLowerCase();const items=D.codes.filter(x=>x.join(' ').toLowerCase().includes(q));return items.length ? items.map(([code,name,hint])=>`<div class="code-card"><code>${safe(code)}</code><strong>${safe(name)}</strong><small>${safe(hint)}</small></div>`).join('') : `<p class="muted">Ничего не найдено.</p>`;}
  function renderCodes(){return header('03 / КАРМАННЫЙ СПРАВОЧНИК','G / M <span>коды</span>','Значение команд для обучения. Формат циклов и M-коды обязательно проверять по руководству конкретного станка.')+
    `<div class="field"><label for="code-search">Поиск кода или названия</label><input id="code-search" type="search" placeholder="Например: G71, шпиндель, резьба" autocomplete="off"></div><div class="code-list" id="code-results">${codeCards()}</div>${alert()}`;}
  function renderDiary(){return header('04 / ЛИЧНЫЙ ОПЫТ','Дневник <span>токаря</span>','Записывай то, что уже проверил вместе с наставником. Можно приложить фотографию с телефона.')+
    `<div class="panel"><h2 style="margin-top:0;font-size:18px">Новая заметка</h2><form id="diary-form"><div class="field"><label for="diary-text">Что сегодня изучил?</label><textarea id="diary-text" required maxlength="3000" rows="4" placeholder="Например: где находится вкладка OFFSET на нашем EMCO…"></textarea></div><div class="field"><label for="diary-photo">Фотография панели или конспекта (необязательно)</label><input id="diary-photo" type="file" accept="image/*"><small class="muted" id="photo-status">${photoDraft?'Фото подготовлено':'Изображение будет уменьшено для хранения офлайн'}</small></div><button class="button full" type="submit">＋ Сохранить заметку</button></form></div>
    <div class="section-head"><h2>Мои записи</h2><small>${state.diary.length} шт.</small></div>${state.diary.length?state.diary.map(item=>`<article class="record"><span class="date">${safe(item.date)}</span><p>${safe(item.text)}</p>${item.photo?`<img src="${item.photo}" alt="Фото к заметке" loading="lazy">`:''}<div class="record-actions"><button class="button ghost" data-delete-note="${safe(item.id)}">Удалить</button></div></article>`).join(''):'<div class="panel muted">Пока пусто. Первая запись — первый шаг к уверенной работе! ⚙️</div>'}<p class="preview-note">Заметки хранятся только на этом устройстве. Регулярно сохраняй резервную копию в настройках.</p>`;}
  function renderPreflight(){const items=[['guard','Ограждения, зона и аварийный останов проверены'],['clamp','Заготовка и инструмент надёжно закреплены'],['program','Нужная программа и инструмент проверены'],['offsets','Активная система координат и коррекции проверены'],['dryrun','Безопасная проверка траектории согласована']];
    return `<button class="back" data-go="home">← Главная</button>`+header('РЕЖИМ «Я У СТАНКА»','Контрольный <span>лист</span>','Отмечай только реально выполненные проверки. Это памятка, а не автоматическое подтверждение безопасности.')+
    `<div class="panel"><div class="checklist">${items.map(([key,label])=>`<div class="checkitem"><input type="checkbox" id="pf-${key}" data-pf="${key}" ${state.checks[key]?'checked':''}><label for="pf-${key}">${safe(label)}</label></div>`).join('')}</div><hr class="thin"><button class="button secondary" data-reset-pf="1">Сбросить список перед новой наладкой</button></div>`+
    `<div class="notice"><strong>Даже если все пункты отмечены,</strong> это не разрешение запускать станок. Руководствуйся инструкцией предприятия и проверкой ответственного специалиста.</div>`;}
  function renderCalc(){return `<button class="back" data-go="home">← Главная</button>`+header('05 / РАСЧЁТ','Калькулятор <span>резания</span>','Теоретический расчёт оборотов и минутной подачи. Не используй результат как готовый режим без учёта материала, инструмента и ограничений станка.')+
    `<div class="panel"><div class="field"><label for="vc">Скорость резания Vc (м/мин)</label><input type="number" min="0.01" max="10000" step="any" id="vc" value="120"></div><div class="field"><label for="diameter">Диаметр D (мм)</label><input type="number" min="0.01" max="10000" step="any" id="diameter" value="40"></div><div class="field"><label for="feed">Подача f (мм/оборот)</label><input type="number" min="0.001" max="100" step="any" id="feed" value="0.15"></div><hr class="thin"><div class="muted" style="font-size:12px">Расчётные обороты шпинделя</div><div id="rpm-out" class="calc-result"></div><div class="muted" style="font-size:12px">Расчётная подача в минуту</div><div id="feed-out" class="calc-result"></div><p class="preview-note">Формулы: n = (1000 × Vc) / (π × D); Vf = n × f. Для режима G96 обороты меняются с диаметром; соблюдай ограничение оборотов по станку и патрону.</p></div>${alert()}`;}
  function renderSettings(){return header('06 / ПРОФИЛЬ','Мои <span>настройки</span>','Профиль станка и сохранение данных без облака.')+
    `<div class="panel"><div class="field"><label for="machine-name">Мой станок</label><input id="machine-name" maxlength="120" value="${safe(state.machine)}"></div><button class="button secondary" id="save-machine">Сохранить название</button><hr class="thin"><h2 style="font-size:17px">Резервная копия</h2><p class="muted" style="font-size:13px">Экспортирует уроки, инструменты и дневник с фотографиями в JSON. Импорт заменит текущие данные.</p><div class="inline-actions"><button class="button" id="export-btn">⬇ Экспорт JSON</button><button class="button secondary" id="import-btn">⬆ Импорт JSON</button><input type="file" id="import-file" accept="application/json,.json" style="display:none"></div></div><div class="panel"><strong>🔐 Конфиденциальность</strong><p class="muted" style="font-size:13px">NEXA CNC 0.2 WEB работает без учётной записи, интернета, рекламы и подключения к ЧПУ. Фото и заметки остаются в памяти приложения, пока ты их не экспортируешь или не удалишь.</p><p class="preview-note">Версия 0.2.1 WEB · экспериментальный учебный помощник · учебные карточки требуют проверки под конкретный EMCO.</p></div>${alert()}`;}
  function render(){
    const screens={home:renderHome,lessons:renderLessons,lesson:renderLesson,tools:renderTools,codes:renderCodes,diary:renderDiary,preflight:renderPreflight,calc:renderCalc,settings:renderSettings,simulator:()=>window.CncSimulator.render(),trainer:()=>window.CncOffsetTrainer.render()};
    app.innerHTML=(screens[route]||renderHome)();
    document.querySelectorAll('.bottomnav button').forEach(b=>{const on=b.dataset.route===route ||(route==='lesson'&&b.dataset.route==='lessons')||(route==='preflight'&&b.dataset.route==='home');b.classList.toggle('active',on);b.setAttribute('aria-current',on?'page':'false');});
    if(route==='calc')recalculate();
  }
  function recalculate(){const vc=Number(document.getElementById('vc')?.value), dia=Number(document.getElementById('diameter')?.value),f=Number(document.getElementById('feed')?.value);
    const n=D.rpm(vc,dia),v=D.mmMin(f,n);
    document.getElementById('rpm-out').innerHTML=n&&n<=1000000?`${Math.round(n).toLocaleString('ru-RU')} <small>об/мин</small>`:'—';
    document.getElementById('feed-out').innerHTML=v&&v<=10000000?`${Math.round(v).toLocaleString('ru-RU')} <small>мм/мин</small>`:'—';}
  function photoFromFile(file){return new Promise((resolve,reject)=>{
    if(!file || !file.type.startsWith('image/')||file.size>15*1024*1024)return reject(new Error('Выбери изображение до 15 МБ'));
    const url=URL.createObjectURL(file), img=new Image();
    img.onload=()=>{try{const max=960,r=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.max(1,Math.round(img.width*r));c.height=Math.max(1,Math.round(img.height*r));c.getContext('2d').drawImage(img,0,0,c.width,c.height);const output=c.toDataURL('image/jpeg',.7);URL.revokeObjectURL(url);if(output.length>590000)throw new Error('Фото слишком большое после сжатия');resolve(output);}catch(e){reject(e);}};
    img.onerror=()=>{URL.revokeObjectURL(url);reject(new Error('Не удалось открыть фото'));};img.src=url;
  });}
  function exportBackup(){const payload=JSON.stringify(state,null,2);
    if(new TextEncoder().encode(payload).length>8*1024*1024){showToast('Копия больше 8 МБ: уменьши число фото');return;}
    if(window.Native && typeof window.Native.saveBackup==='function'){window.Native.saveBackup(payload);return;}
    const blob=new Blob([payload],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='NEXA-CNC-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),5000);
  }
  async function importBackup(text){try{if(text.length>8*1024*1024)throw new Error('Резервная копия превышает 8 МБ');const raw=JSON.parse(text);if(!raw||raw.version!==1||!Array.isArray(raw.tools)||!Array.isArray(raw.diary))throw new Error('Неверный формат NEXA CNC');if(!window.confirm('Заменить все текущие записи данными из резервной копии?'))return;state=D.normalizeState(raw);await persist();route='home';photoDraft='';render();showToast('✅ Резервная копия восстановлена');}catch(e){showToast('Ошибка импорта: '+String(e.message||e));}}
  window.NEXA_import=importBackup;
  document.addEventListener('click',async e=>{
    const navBtn=e.target.closest('[data-route],[data-go]');if(navBtn){nav(navBtn.dataset.go||navBtn.dataset.route,navBtn.dataset.detail);return;}
    const toolBtn=e.target.closest('[data-tool]');if(toolBtn){toolPosition=Number(toolBtn.dataset.tool);render();return;}
    const del=e.target.closest('[data-delete-note]');if(del){if(confirm('Удалить эту заметку и прикреплённое фото?')){state.diary=state.diary.filter(n=>n.id!==del.dataset.deleteNote);await persist();render();showToast('Запись удалена');}return;}
    if(e.target.closest('[data-reset-pf]')){state.checks={};await persist();render();showToast('Список сброшен');return;}
    if(e.target.id==='save-machine'){state.machine=document.getElementById('machine-name').value.trim().slice(0,120)||'EMCOturn · FANUC 0i-TD';await persist();showToast('Станок сохранён');return;}
    if(e.target.id==='export-btn'){exportBackup();return;}
    if(e.target.id==='import-btn'){if(window.Native&&typeof window.Native.openBackup==='function')window.Native.openBackup();else document.getElementById('import-file').click();}
  });
  document.addEventListener('change',async e=>{
    const el=e.target;
    if(el.matches('[data-lesson-check]')){const id=el.dataset.lessonCheck, lesson=D.lessons.find(l=>l.id===id),i=Number(el.dataset.index);if(!lesson||!(i>=0&&i<lesson.steps.length))return;if(!state.lessonChecks[id])state.lessonChecks[id]=Array(lesson.steps.length).fill(false);state.lessonChecks[id][i]=el.checked;await persist();render();return;}
    if(el.matches('[data-pf]')){state.checks[el.dataset.pf]=el.checked;await persist();return;}
    if(el.id==='diary-photo'&&el.files?.length){document.getElementById('photo-status').textContent='Обрабатываю фото…';try{photoDraft=await photoFromFile(el.files[0]);document.getElementById('photo-status').textContent='✅ Фото готово, сохранится вместе с заметкой';}catch(err){photoDraft='';document.getElementById('photo-status').textContent='⚠️ '+err.message;}}
    if(el.id==='import-file'&&el.files?.length){const file=el.files[0];if(file.size>8*1024*1024){showToast('Файл слишком большой');return;}await importBackup(await file.text());el.value='';}
  });
  document.addEventListener('input',e=>{if(e.target.id==='code-search')document.getElementById('code-results').innerHTML=codeCards(e.target.value);if(['vc','diameter','feed'].includes(e.target.id))recalculate();});
  document.addEventListener('submit',async e=>{
    if(e.target.id==='tool-form'){e.preventDefault();const t=state.tools[toolPosition-1];t.name=document.getElementById('tool-name').value.trim();t.kind=document.getElementById('tool-kind').value.trim();t.x=document.getElementById('tool-x').value.trim();t.z=document.getElementById('tool-z').value.trim();t.note=document.getElementById('tool-note').value.trim();await persist();render();showToast(`✅ Позиция T${toolPosition} сохранена`);}
    if(e.target.id==='diary-form'){e.preventDefault();const text=document.getElementById('diary-text').value.trim();if(!text){showToast('Добавь текст заметки');return;}state.diary.unshift({id:String(Date.now())+'-'+Math.random().toString(36).slice(2,8),date:new Date().toLocaleString('ru-RU'),text:text.slice(0,3000),photo:photoDraft});state.diary=state.diary.slice(0,150);try{await persist();photoDraft='';render();showToast('✅ Заметка сохранена');}catch{state.diary.shift();}}
  });
  window.addEventListener('hashchange',syncHash);window.addEventListener('popstate',syncHash);
  loadStore().then(syncHash).catch(err=>{app.textContent='Не удалось запустить приложение: '+err.message;});
})();

</script>
</body>
</html>
